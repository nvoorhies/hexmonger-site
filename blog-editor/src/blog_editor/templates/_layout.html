<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% endblock %}">
<link rel="canonical" href="{% block canonical %}{% endblock %}">
<meta name="theme-color" content="#0f0d14">
<meta name="generator" content="{{ generator }}">
<link rel="icon" href="/assets/img/hexmonger-mark.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/blog.css">
<link rel="alternate" type="application/atom+xml" title="Hexmonger blog" href="/blog/feed.xml">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Hexmonger home">
      <img src="/assets/img/hexmonger-mark.svg" alt="" width="30" height="30">
      <span>Hexmonger</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/#games">Games</a>
      <a href="/blog/"{% if is_index %} aria-current="page"{% endif %}>Blog</a>
      <a href="/#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">
{% block main %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 Hexmonger. All rights reserved.</span>
    <span><a href="/blog/feed.xml">Feed</a> · <a href="https://policies.hexmonger.com/">Policies</a> · <a href="mailto:support@hexmonger.com">Support</a></span>
  </div>
</footer>
</body>
</html>
